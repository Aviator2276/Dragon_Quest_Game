<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Welcome!</title>
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
        <link rel="stylesheet" href="site.css">
        <style>
            .selArea {
                position: absolute;
                display: flex;
                flex-wrap: wrap;
                z-index: 1;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                opacity: 100%;
            }
            .teamSel {
                height: 50%;
                width: 50%;
                font-family: Aldrich;
                background-color: white;
                color: white;
                text-align: center;
                font-size: 8vw;
                transition: .3s;
            }
            #oneTeam {
                background-color: #A81307;
            }
            #twoTeam {
                background-color: #E65428;
            }
            #threeTeam {
                background-color: #FCC601;
            }
            #fourTeam {
                background-color: #265C92;
            }
            .hidePrompt {
                opacity: 0%;
                width: 0%;
                height: 0%;
            }
            .oneSel{
                height: 100% !important;
                width: 100% !important;
                z-index: 5 !important;

            }
            .twoSel {
                height: 100% !important;
                width: 100% !important;
                z-index: 5 !important;

            }
            .threeSel {
                height: 100% !important;
                width: 100% !important;
                z-index: 5 !important;

            }
            .fourSel {
                height: 100% !important;
                width: 100% !important;
                z-index: 5 !important;
                
            }
            main {
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                pointer-events: none;
            }
            .trans {
                position: absolute;
                border-radius: 50%;
                filter: blur(1px);
                z-index: 2;
                animation: transitionIn 1.6s forwards;
            }
            #transition {
                width: 10px;
                height: 10px;
                top: 50%;
                left: 50%;
                background-color: white;
            }
            @keyframes transitionIn {
                100% {
                    transform: scale(0, 0);
                }
                60% {
                    transform: scale(50, 50);
                }
                0% {
                    transform: scale(2000, 2000);
                }
            }
            @keyframes transitionOut {
                0% {
                    transform: scale(0, 0);
                }
                40% {
                    transform: scale(50, 50);
                }
                100% {
                    transform: scale(2000, 2000);
                }
            }
        </style>
    </head>
    <body>
        <span id="transition" class="trans"></span>
        <span id="hyperSpace"></span>
        <div class="selArea">
            <button id="oneTeam" class="teamSel">Red</button>
            <button id="twoTeam" class="teamSel">Blue</button>
            <button id="threeTeam" class="teamSel">Green</button>
            <button id="fourTeam" class="teamSel">Purple</button>
        </div>
        <main>
            <h1 class="prompt" id="Mesg">Question 1, What color is the sky?</h1>
        </main>
        <script src="preliminary.js" async></script> 
    </body>
</html>
