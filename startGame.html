<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Welcome!</title>
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
        <link rel="stylesheet" href="site.css">
        <style>
            #startGame {
                position: absolute;
                display:block;
                z-index: 1;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background-color: white;
                opacity: 10%;
            }
            main {
                position: absolute;
                text-align: center;
                width: 100%;
                top: 20%;
            }
            img {
                position: absolute;
                width: 100%;
                z-index: -1;
                opacity: 25%;
            }
            .description {
                font-family: 'Aldrich';
                font-size: 4vw;
                padding: 8% 0%;
                text-align: center;
                position: relative;
                display: inline-block;
                color: white;
                -webkit-text-stroke-width: 3px;
                -webkit-text-stroke-color: black;
                text-transform: uppercase;
                animation: wavyTextStartInit 4s;
                animation-fill-mode: both;
            }
            .space {
                padding: 3%;
            }
            .wavyTextStart span {
                font-family: 'Aldrich';
                font-size: 12vw;
                text-align: center;
                position: relative;
                display: inline-block;
                color: white;
                -webkit-text-stroke-width: 8px;
                -webkit-text-stroke-color: black;
                text-transform: uppercase;
                animation: wavyTextStartInit 1.5s;
                animation-fill-mode: both;
                animation-delay: calc(.1s * var(--i));
            }
            .infinite span {
                animation: wavyTextStartInfinite 2s infinite;
                animation-delay: calc(.1s * var(--i));
            }
            @keyframes wavyTextStartInit {
                0% {
                    transform: translateY(2000px);
                }
                100% {
                    transform: translateY(0);
                }
            }
            @keyframes wavyTextStartInfinite {
                0%,60%,100% {
                    transform: translateY(0);
                }
                20% {
                    transform: translateY(-40px);
                }
                40% {
                    transform: translateY(20px);
                }
            }
        </style>
    </head>
    <body>
        <button id="startGame"></button>
        <main>
            <div class="wavyTextStart" id="wavyTextStart">
                <span style="--i:1">S</span>
                <span style="--i:2">T</span>
                <span style="--i:3">A</span>
                <span style="--i:4">R</span>
                <span style="--i:5">T</span>
                <span class="space"></span>
                <span style="--i:6">G</span>
                <span style="--i:7">A</span>
                <span style="--i:8">M</span>
                <span style="--i:9">E</span>
            </div>
            <p class="description">Tap or hit anywhere</p>
        </main>
        <img src="assets/background2.gif" alt="Background Retro Themed">
        <script>
            const startGame = document.querySelector("#startGame");

            window.addEventListener('load', function () {
                const element = document.getElementById('wavyTextStart');
                setTimeout(() => element.classList.add('infinite'), 2300);
            });
            startGame.onclick = () => {
                window.open('config.html','_self',false);
            };
        </script>
    </body>
</html>
