<!DOCTYPE html>

    <head>
        <meta charset="UTF-8">
        <title>Welcome!</title>
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
        <link rel="stylesheet" href="site.css">
        <style>
            #startGame {
                position: absolute;
                display: block;
                z-index: 10;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background-color: white;
                opacity: 0%;
            }
            main {
                position: absolute;
                text-align: center;
                width: 100%;
                top: 20%;
            }
            .description {
                font-family: 'Aldrich';
                font-size: 4vw;
                padding: 8% 0%;
                text-align: center;
                position: relative;
                display: inline-block;
                color: white;
                -webkit-text-stroke-width: 3px;
                -webkit-text-stroke-color: black;
                text-transform: uppercase;
                animation: wavyTextStartInit 4s;
                animation-fill-mode: both;
            }
            .space {
                padding: 3%;
            }
            .wavyTextStart span {
                font-family: 'Aldrich';
                font-size: 12vw;
                text-align: center;
                position: relative;
                display: inline-block;
                color: white;
                -webkit-text-stroke-width: 5px;
                -webkit-text-stroke-color: black;
                text-transform: uppercase;
                animation: wavyTextStartInit 1.5s, color-animation 3s linear infinite;
                animation-fill-mode: both;
                animation-delay: calc(.1s * var(--i));
            }
            .infinite span {
                animation: wavyTextStartInfinite 2s infinite, color-animation 3s linear infinite;
                animation-delay: calc(.1s * var(--i));
            }
            .title-word-1 {
                --color-1: #A81307;
                --color-2: #E65428;
                --color-3: #FCC601;
                --color-4: #265C92;
            }
            .title-word-2 {
                --color-1: #A81307;
                --color-2: #E65428;
                --color-3: #FCC601;
                --color-4: #265C92;
            }
            .title-word-3 {
                --color-1: #A81307;
                --color-2: #E65428;
                --color-3: #FCC601;
                --color-4: #265C92;
            }
            .title-word-4 {
                --color-1: #A81307;
                --color-2: #E65428;
                --color-3: #FCC601;
                --color-4: #265C92;
            }
            @keyframes color-animation {
                0%    {color: var(--color-1)}
                24%   {color: var(--color-1)}
                25%   {color: var(--color-2)}
                49%   {color: var(--color-2)}
                50%   {color: var(--color-3)}
                74%   {color: var(--color-3)}
                75%  {color: var(--color-4)}
                99%  {color: var(--color-4)}
                100%  {color: var(--color-1)}
            }
            @keyframes wavyTextStartInit {
                0% {
                    transform: translateY(2000px);
                }
                100% {
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <span id="transition"></span>
        <span id="hyperSpace"></span>
        <button id="startGame"></button>
        <main>
            <div class="wavyTextStart" id="wavyTextStart">
                <span style="--i:1" class="title-word title-word-1">S</span>
                <span style="--i:2" class="title-word title-word-2">T</span>
                <span style="--i:3" class="title-word title-word-3">A</span>
                <span style="--i:4" class="title-word title-word-4">R</span>
                <span style="--i:5" class="title-word title-word-1">T</span>
                <span class="space"></span>
                <span style="--i:6" class="title-word title-word-2">G</span>
                <span style="--i:7" class="title-word title-word-3">A</span>
                <span style="--i:8" class="title-word title-word-4">M</span>
                <span style="--i:9" class="title-word title-word-1">E</span>
            </div>
            <p class="description">Tap or hit anywhere to start</p>
