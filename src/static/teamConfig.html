<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Team Configuration</title>
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
        <link rel="stylesheet" href="site.css" />
        <style>
            main {
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                pointer-events: none;
            }
            .prompt {
                animation: promptInit 2.5s forwards !important;
            }
            #confirmMesg {
                z-index: 5;
                margin-bottom: 40% !important;
            }
        </style>
    </head>
    <body>
        <span id="transition" class="trans"></span>
        <span id="hyperSpace"></span>
        <div class="selArea" id="optionArea">
            <button id="oneTeam" class="teamSel">1</button>
            <button id="twoTeam" class="teamSel">2</button>
            <button id="threeTeam" class="teamSel">3</button>
            <button id="fourTeam" class="teamSel">4</button>
        </div>
        <div id="confirmSelect" class="hidden">
            <button id="confirmed">YES</button>
            <button id="notConfirmed">NO</button>
        </div>
        <main>
            <h1 class="prompt" id="Mesg">Select how many teams are playing?</h1>
            <h1 id="confirmMesg" class="hidden">Confirm Selection?</h1>            
        </main>
        <script type="module" src="../renderer/teamConfig.js" async></script> 
    </body>
</html>
